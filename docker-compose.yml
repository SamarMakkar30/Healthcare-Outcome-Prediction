# Healthcare Prediction System - Docker Compose
# Production-ready multi-container setup

version: '3.8'

services:
  # ==========================================================================
  # Main API Service
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: healthcare-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_SHAP_EXPLANATIONS=${ENABLE_SHAP_EXPLANATIONS:-true}
      - ENABLE_AUDIT_LOGGING=${ENABLE_AUDIT_LOGGING:-true}
      - DIABETES_THRESHOLD=${DIABETES_THRESHOLD:-0.35}
      - HEART_DISEASE_THRESHOLD=${HEART_DISEASE_THRESHOLD:-0.40}
      - STROKE_THRESHOLD=${STROKE_THRESHOLD:-0.30}
      # Uncomment for Redis caching
      # - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - model-registry:/app/models/registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - healthcare-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

